  b.innerHTML=`<span class="dow">${weekdays[d.getDay()]}</span><span class="day">${d.getDate()}</span><span class="dot"></span>${isTest?'<span class="test-label">測驗</span>':""}`;
  b.title=`${d.getMonth()+1}月${d.getDate()}日`;
  b.addEventListener("click",()=>{selected=key;renderMonthTabs();renderDates();renderDay();b.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest",inline:"center"});});
  strip.appendChild(b);
 });
}
function renderDay(){
 const d=new Date(selected+"T12:00:00"), info=data[selected]||{loc:(d.getDay()===0||d.getDay()===6)?"週末":"未列排定課程",off:true,events:[["全天","目前沒有排定課程","請以最新公告或實際通知為準。"]]};
 document.getElementById("monthLabel").textContent=`${d.getFullYear()} 年 ${d.getMonth()+1} 月`;
 document.getElementById("dayLocation").textContent=info.loc;
 const index=all.findIndex(x=>fmtDate(x)===selected)+1;
 document.getElementById("dayCount").textContent=info.off?"休息日":`訓練行程第 ${index} 天`;
 const dateText=`${d.getMonth()+1} 月 ${d.getDate()} 日（星期${weekdays[d.getDay()]}）`;
 let html=`<div class="day-summary"><h3>${dateText}</h3><span class="tag ${info.off?'pink':'green'}">${info.off?'休假／無課':'課程日'}</span><span class="tag">${info.loc}</span></div>`;
 if(!info.events||!info.events.length)html+='<div class="empty">今天沒有排定課程，享受一點空白時間吧。</div>';
 else html+='<div class="timeline">'+info.events.map((e,i)=>`<article class="event ${e[1].includes('測驗')?'is-test':''}"><div class="time">${e[0]}</div><div class="event-body"><div><h4>${e[1]}</h4><p>${e[2]||""}</p></div><div class="event-mark">${info.off?'☁':(e[1].includes('測驗')?'✎':e[1].includes('實習')||e[1].includes('操作')?'⚙':'✿')}</div></div></article>`).join('')+'</div>'; 
 detail.innerHTML=html;
 detail.classList.remove("pop");void detail.offsetWidth;detail.classList.add("pop");
}
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)");
function syncMotion(){document.body.classList.toggle("reduced",reduce.matches)}
syncMotion();if(reduce.addEventListener)reduce.addEventListener("change",syncMotion);
renderMonthTabs();renderDates();renderDay();
</script>
</body>
</html>
